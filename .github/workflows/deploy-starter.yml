name: Deploy Starter To VPS

on:
  push:
    branches:
      - starter

concurrency:
  group: deploy-starter
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Deploy over SSH
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          script_stop: true
          command_timeout: 30m
          script: |
            set -e

            # Make sure PATH is available in non-interactive shells.
            export PATH="$PATH:/usr/local/bin:/usr/bin:/bin"

            cd ~/estate
            git fetch origin starter
            git checkout starter
            git pull --ff-only origin starter

            cd ~/estate/api
            if [ -f package-lock.json ]; then
              npm ci
            else
              npm install
            fi

            # Keep Prisma client/schema in sync with DB on each backend deploy.
            if [ -f prisma/schema.prisma ]; then
              npx prisma generate
              npx prisma db push
            fi

            pm2 restart api --update-env
            if pm2 describe socket >/dev/null 2>&1; then
              pm2 restart socket --update-env
            fi
            pm2 save

            cd ~/estate/client
            if [ -f package-lock.json ]; then
              npm ci
            else
              npm install
            fi
            npm run build

            rsync -av --delete dist/ /var/www/estateui/

            if command -v sudo >/dev/null 2>&1; then
              sudo nginx -t
              sudo systemctl reload nginx
            else
              nginx -t
              systemctl reload nginx
            fi
