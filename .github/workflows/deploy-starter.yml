name: Deploy Starter To VPS

on:
  push:
    branches:
      - starter

concurrency:
  group: deploy-starter
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure SSH
        env:
          VPS_SSH_KEY_B64: ${{ secrets.VPS_SSH_KEY_B64 }}
        run: |
          set -e
          if [ -z "$VPS_SSH_KEY_B64" ]; then
            echo "VPS_SSH_KEY_B64 secret is empty or missing."
            exit 1
          fi
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          printf "%s" "$VPS_SSH_KEY_B64" | tr -d ' \r\n' | base64 --decode > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -H 85.215.173.47 >> ~/.ssh/known_hosts
          chmod 644 ~/.ssh/known_hosts
          ssh-keygen -y -f ~/.ssh/deploy_key >/dev/null

      - name: Deploy over SSH
        run: |
          ssh -i ~/.ssh/deploy_key -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes root@85.215.173.47 <<'EOF'
            set -e

            # Make sure PATH is available in non-interactive shells.
            export PATH="$PATH:/usr/local/bin:/usr/bin:/bin"

            cd ~/estate
            PREV_SHA="$(git rev-parse HEAD)"
            git fetch origin starter
            git checkout starter
            git pull --ff-only origin starter
            NEW_SHA="$(git rev-parse HEAD)"

            if [ "$PREV_SHA" = "$NEW_SHA" ]; then
              echo "No new commit to deploy."
              exit 0
            fi

            CHANGED_FILES="$(git diff --name-only "$PREV_SHA" "$NEW_SHA")"
            echo "Changed files:"
            echo "$CHANGED_FILES"

            DEPLOY_API=false
            DEPLOY_CLIENT=false

            if echo "$CHANGED_FILES" | grep -q '^api/'; then
              DEPLOY_API=true
            fi

            if echo "$CHANGED_FILES" | grep -q '^client/'; then
              DEPLOY_CLIENT=true
            fi

            if [ "$DEPLOY_API" = false ] && [ "$DEPLOY_CLIENT" = false ]; then
              echo "No API or client changes detected; skipping deployment."
              exit 0
            fi

            rollback() {
              EXIT_CODE=$?
              if [ "$EXIT_CODE" -eq 0 ]; then
                return
              fi

              echo "Deployment failed. Rolling back to $PREV_SHA"
              set +e

              cd ~/estate
              git reset --hard "$PREV_SHA"

              if [ "$DEPLOY_API" = true ]; then
                cd ~/estate/api
                if [ -f package-lock.json ]; then
                  npm ci
                else
                  npm install
                fi

                if [ -f prisma/schema.prisma ]; then
                  npx prisma generate
                  npx prisma db push
                fi

                pm2 restart api --update-env
                if pm2 describe socket >/dev/null 2>&1; then
                  pm2 restart socket --update-env
                fi
                pm2 save
              fi

              if [ "$DEPLOY_CLIENT" = true ]; then
                cd ~/estate/client
                if [ -f package-lock.json ]; then
                  npm ci
                else
                  npm install
                fi
                npm run build
                rsync -av --delete dist/ /var/www/estateui/
                if command -v sudo >/dev/null 2>&1; then
                  sudo nginx -t
                  sudo systemctl reload nginx
                else
                  nginx -t
                  systemctl reload nginx
                fi
              fi

              echo "Rollback complete."
              exit "$EXIT_CODE"
            }

            trap rollback ERR

            if [ "$DEPLOY_API" = true ]; then
              echo "Deploying API changes..."
              cd ~/estate/api
              if [ -f package-lock.json ]; then
                npm ci
              else
                npm install
              fi

              if [ -f prisma/schema.prisma ]; then
                npx prisma generate
                npx prisma db push
              fi

              pm2 restart api --update-env
              if pm2 describe socket >/dev/null 2>&1; then
                pm2 restart socket --update-env
              fi
              pm2 save
            fi

            if [ "$DEPLOY_CLIENT" = true ]; then
              echo "Deploying client changes..."
              cd ~/estate/client
              if [ -f package-lock.json ]; then
                npm ci
              else
                npm install
              fi
              npm run build
              rsync -av --delete dist/ /var/www/estateui/
              if command -v sudo >/dev/null 2>&1; then
                sudo nginx -t
                sudo systemctl reload nginx
              else
                nginx -t
                systemctl reload nginx
              fi
            fi

            # Post-deploy health checks.
            if [ "$DEPLOY_API" = true ]; then
              echo "Checking API health..."
              curl -fsS --max-time 10 "http://127.0.0.1:8800/api/test/test" >/dev/null
            fi

            if [ "$DEPLOY_CLIENT" = true ]; then
              echo "Checking frontend health..."
              curl -fsS --max-time 10 "http://127.0.0.1/" >/dev/null
            fi

            echo "Deployment successful for commit $NEW_SHA"
          EOF
